# serves the built website
# the proxy sends api and websocket requests to the backend, so they never reach this container
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # built files have a hash in the name, so the browser can keep them
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # any other path opens the app
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
